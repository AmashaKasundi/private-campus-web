<div class="main-container">
    <aside class="sidebar">
        <ul>
            <li><a href="#about">About Us</a></li>
            <li><a href="#vision">Vision & Mission</a></li>
            <li><a href="#facilities">Facilities</a></li>
        </ul>
    </aside>

    <div class="content-wrapper">
        <section id="home" class="hero-section">
            <div class="hero-content">
                <h1>Welcome to Our Campus</h1>
                <p>Empowering the next generation of leaders.</p>
                <a href="#registration" class="cta-button">Register Now</a>
            </div>
        </section>

        <section id="registration" class="registration-section">
            <h2>Student Registration</h2>
            <form id="regForm">
                <div class="profile-upload">
                    <div class="image-placeholder" id="imagePreview">
                        <span>📷</span>
                    </div>
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <button type="button" onclick="document.getElementById('imageInput').click()">Upload Photo</button>
                </div>

                <div class="form-grid">
                    <input type="text" placeholder="Full Name" required>
                    <input type="text" placeholder="Name with Initials" required>
                    <input type="date" title="Birthday" required>
                    <input type="number" placeholder="Age" required>
                    <input type="text" placeholder="School" required>
                    <input type="text" placeholder="Address" required>
                    <input type="text" placeholder="Home Town" required>
                    <input type="tel" placeholder="Phone Number 1" required>
                    <input type="tel" placeholder="Phone Number 2">
                    <input type="email" placeholder="Email Address" required>
                </div>
                <button type="submit" class="submit-btn">Submit Registration</button>
            </form>
        </section>
    </div>
</div>
